            import { AuthStorage } from './pages/scripts/auth-storage.js'
            let authStorage = new AuthStorage()
            if (!authStorage.isAuthenticated()) {
                const returnUrl = encodeURIComponent(window.location.href);
                window.location.href = `pages/auth/auth-login/auth-login.html?returnUrl=${returnUrl}`;
            }
        </script>
